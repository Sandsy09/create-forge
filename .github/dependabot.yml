version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 5
    labels: ["type:chore", "area:ci"]

  # Covers pyproject.toml + uv.lock. Does NOT cover
  # .pre-commit-config.yaml's pinned hook revisions -- those stay manual.
  # That gap is exactly what produced the stale ruff pin in #4 (pre-commit's
  # v0.14.0 disagreeing with the venv's resolved 0.16.3); Renovate covers
  # pre-commit revs too, but needs its GitHub App installed through the web
  # UI, so Dependabot was chosen for now. See issue #17.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 5
    labels: ["type:chore", "area:packaging"]
    # Two compatibility-line dependencies now (ADR 0012). Crossing a Copier
    # major must change runner.py, the bound, and the documented
    # compatibility table together -- see CLAUDE.md invariant 4 -- so
    # Dependabot proposes updates inside the line only.
    # forge-template (ADR 0018) is pre-1.0, so a minor bump is itself a new
    # compatibility line, same as a Copier major -- both semver-major and
    # semver-minor are ignored for it, not just semver-major.
    # tests/test_engine_contract.py reads this block; deleting either rule
    # fails the fast suite.
    ignore:
      - dependency-name: "copier"
        update-types: ["version-update:semver-major"]
      - dependency-name: "forge-template"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
