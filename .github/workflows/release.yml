name: Release

# pyproject.toml is the single version source (ADR 0009) -- not a bump input,
# unlike forge-template's release workflow. This workflow only ever reads the
# version that is already committed; bumping it happens in an ordinary PR.
#
# Run from the Actions tab: dry_run first to preview, then for real.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the tag and notes without creating anything
        type: boolean
        default: false

# No token scope by default; `release` re-grants `contents: write` for the tag
# push and `publish` re-grants `id-token: write` for PyPI Trusted Publishing.
# External actions are pinned to full commit SHAs -- see
# docs/workflow-security.md and scripts/check_workflows.py.
permissions: {}

env:
  UV_VERSION: "0.12.0"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Refuse to release from anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases must be dispatched from main, not ${{ github.ref }}."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Compute version
        id: version
        run: |
          version=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "### Releasing ${tag}" >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse an existing tag
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} already exists. Bump pyproject.toml's version first."
            exit 1
          fi

      - name: Require a changelog entry
        run: |
          version="${{ steps.version.outputs.version }}"
          if ! grep -qF "[${version}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no [${version}] section. Run" \
                 "'uv run git-cliff --tag v${version} --output CHANGELOG.md' first."
            exit 1
          fi

      - name: Check wheel contents
        # Invariant 5 in CLAUDE.md: templates.toml must ship in the wheel.
        # Passes every local test and breaks on a user's first uvx run if it
        # regresses -- this is the one place that is actually load-bearing to
        # run it before a release.
        run: uv run poe check:wheel

      - name: Release notes
        id: notes
        run: |
          tag="${{ steps.version.outputs.tag }}"
          uv run git-cliff --tag "$tag" --unreleased --strip all --output notes.md
          {
            echo "## Release notes"
            echo '```'
            cat notes.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create tag
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tag="${{ steps.version.outputs.tag }}"
          git tag -a "$tag" -m "Release ${tag}"
          git push origin "$tag"

      - name: GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file notes.md

      - name: Dry run -- nothing created
        if: ${{ inputs.dry_run }}
        run: echo "::notice::dry_run was set -- no tag or release created."

  # ---------------------------------------------------------------------------
  # Publishes create-forge itself to PyPI, from the same commit the tag above
  # points to. Uses PyPI Trusted Publishing (OIDC) -- no stored token.
  # ADR 0018: the plain package (no engine) is what most `uvx create-forge`
  # users resolve; `create-forge[engine]` additionally requires the
  # forge-template range this release's contract tests were run against.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/create-forge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Check wheel contents
        run: uv run poe check:wheel

      - name: Build
        run: uv build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
