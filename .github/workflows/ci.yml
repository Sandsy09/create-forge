name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Catches forge-template drift and upstream breakage (new ruff rules, uv
  # releases) even on weeks with no push here -- see tests/test_drift.py.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.0"

jobs:
  # ---------------------------------------------------------------------------
  # Same gate as `uv run pre-commit run --all-files` locally: ruff, and the
  # whitespace/EOF/toml/yaml hooks. Everything else waits on this so a
  # formatting slip doesn't burn the matrix below.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Typecheck
        run: uv run poe typecheck

  # ---------------------------------------------------------------------------
  # Fast tests (-m 'not network') across supported interpreters.
  # ---------------------------------------------------------------------------
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Test
        run: uv run poe test

  # ---------------------------------------------------------------------------
  # Windows smoke test -- path separators, line endings, console encoding.
  # Catches the platform this tool is actually developed on.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows smoke
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Test
        run: uv run poe test

  # ---------------------------------------------------------------------------
  # Invariant 5: templates.toml must ship in the wheel. Passes locally and
  # breaks on a user's first `uvx` run if this ever regresses.
  # ---------------------------------------------------------------------------
  wheel:
    name: Wheel contents
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Check wheel
        run: uv run poe check:wheel

  # ---------------------------------------------------------------------------
  # Everything marked @pytest.mark.network: invariant 1's copier.yml drift
  # guard (clones forge-template at its latest tag) and the real update()
  # end-to-end (scaffolds forge-template's oldest tag, updates to its newest).
  # Both skip (not fail) if GitHub is unreachable, so connectivity issues
  # never masquerade as drift or a real regression. Also runs on the Monday
  # cron, since forge-template moves independently of this repo and a
  # push-only trigger would miss drift on weeks with no commits here.
  # ---------------------------------------------------------------------------
  network:
    name: Network tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Network tests
        run: uv run pytest -m network

  # ---------------------------------------------------------------------------
  # Everything marked @pytest.mark.e2e: the real `create-forge` console
  # script against both generation paths, and each generated project's own
  # `uv run poe check`. A distinct job and marker from `network` above --
  # this is dramatically slower (minutes, not seconds) and must stay
  # separable from the drift guard. Git identity is supplied per-subprocess
  # by the tests themselves, so no runner-level git config step is needed
  # here. Skips (not fails) if GitHub is unreachable, and also runs on the
  # Monday cron alongside `network` for the same reason.
  #
  # Two suites: `test_e2e_generation.py` (CF-07.06, ADR 0016) is the Copier
  # path -- forge-template's latest released tag, its post-generation
  # `_tasks` (git init, uv sync, pre-commit install). `test_e2e_engine_generation.py`
  # (CF-08.04, ADR 0020) is the public-engine path via `--engine-preview` --
  # both archetypes, plus a real released-install compatibility boundary
  # (an out-of-range engine, and no engine extra at all), each rejected with
  # nothing written.
  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-end generation
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: End-to-end tests
        run: uv run poe test:e2e

  # ---------------------------------------------------------------------------
  # Single required status check for branch protection.
  # ---------------------------------------------------------------------------
  all-green:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [lint, test, windows, wheel, network, e2e]
    if: always()
    steps:
      - name: Verify
        run: |
          if echo "${{ join(needs.*.result, ',') }}" | grep -qE 'failure|cancelled'; then
            echo "::error::One or more jobs failed"; exit 1
          fi
          echo "All jobs passed."
