name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Catches forge-template drift and upstream breakage (new ruff rules, uv
  # releases) even on weeks with no push here -- see tests/test_drift.py.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal workflow-wide scope: every job here only ever reads the repo. No job
# is granted `write` or `id-token` -- see docs/workflow-security.md. External
# actions are pinned to full commit SHAs (scripts/check_workflows.py).
permissions:
  contents: read

env:
  UV_VERSION: "0.12.0"

jobs:
  # ---------------------------------------------------------------------------
  # The Linux checks -- documentation, lint, the Python matrix, wheel contents,
  # the dependency floor, network and end-to-end generation -- live in
  # linux-checks.yml so the non-blocking canary in runner-canary.yml runs the
  # identical set on the next Ubuntu image. The runner is an explicit, pinned
  # label, never `ubuntu-latest`, whose target moves on GitHub's schedule
  # (ADR 0058, docs/ci-runner-baseline.md). Moving the baseline is a reviewed
  # change to this one string, in the contract, and in the other workflows.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux (ubuntu-24.04)
    uses: ./.github/workflows/linux-checks.yml
    with:
      runner: ubuntu-24.04

  # ---------------------------------------------------------------------------
  # Windows smoke test -- path separators, line endings, console encoding.
  # Catches the platform this tool is actually developed on.
  #
  # `windows-latest` is deliberately still the moving alias: ADR 0058 scopes the
  # baseline decision to Ubuntu and records this as a known, tracked gap. These
  # jobs do not wait on the Linux lint job -- a job cannot depend on one inside
  # a called workflow -- so a formatting slip no longer short-circuits them.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Test
        run: uv run poe test

  # ---------------------------------------------------------------------------
  # CF-18.03 / ADR 0045: the engine `new` post-rename lifecycle (`git init`,
  # the initial commit, conditional `pre-commit install --install-hooks`) is
  # newly OS-sensitive -- path separators, line endings, hook shims -- and the
  # `windows` smoke job above runs only the fast suite (`-m 'not network and
  # not e2e'`), so it never exercises this. CF-18.04 / ADR 0046 added the
  # engine-native `update` route's own e2e cases to the same OS-sensitivity
  # class (a real `git merge-file` merge, path separators, line endings), and
  # CF-18.06 / ADR 0048 adds the installed cutover suite's own install-mode
  # and legacy cases -- `uv tool install`'s produced console script and the
  # legacy Copier route's own file handling are exactly the same
  # OS-sensitivity class. CF-22.03 / ADR 0054 adds the installed update-safety
  # suite: path containment (a symlink, a junction, a drive-qualified or
  # reserved name) and the recovery commands it prints are OS-sensitive by
  # construction, and CF-22.03's AC-02 requires Linux *and* Windows. This job
  # runs them all rather than widening the Linux `e2e` into a matrix: only
  # these cases need a second OS, not the full 60-minute suite. Exactly the
  # evidence commands docs/engine-cutover-acceptance.md's finalisation,
  # engine-native-update, and installed-cutover rows name, plus
  # docs/update-safety-validation.md's installed suite.
  #
  # The list below is hand-picked, so a new installed module is silently absent
  # from Windows unless it is named here -- tests/test_update_safety_evidence.py
  # guards this one.
  # ---------------------------------------------------------------------------
  e2e-windows:
    name: End-to-end lifecycle and update (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: End-to-end lifecycle tests
        run: uv run pytest tests/test_e2e_engine_generation.py -k lifecycle

      - name: Engine-native update tests
        run: uv run pytest tests/test_update_engine.py

      - name: Installed cutover install-mode and legacy tests
        run: uv run pytest tests/test_e2e_installed_cutover.py -k "install_modes or legacy"

      - name: Installed update-safety tests
        run: uv run pytest tests/test_e2e_installed_update_safety.py

  # ---------------------------------------------------------------------------
  # CF-23.02 / ADR 0057: proves the installed console under a *verified*
  # non-UTF-8 Windows interpreter setting, across the full supported Python
  # window (docs/engine-cutover-acceptance.md's Python axis) -- the job
  # above runs the fast/e2e Windows evidence at a single interpreter (3.13),
  # which cannot itself prove "across the Python matrix". No `PYTHONUTF8` or
  # `PYTHONIOENCODING` is set anywhere in this job, deliberately: the module's
  # own lanes set what each scenario needs, and this job's ambient state is
  # what a plain Windows install starts with. `CREATE_FORGE_E2E_PYTHON` picks
  # the interpreter the *candidate client* runs under -- `uv` provisions it
  # regardless of the interpreter this job itself was set up with (the exact
  # mechanism `test_install_modes_python_window_edge`'s own `python=` already
  # relies on, unattended, in the job above). `tests/test_installed_encoding_
  # guard.py` fails if a new supported interpreter is added here without the
  # matrix, or if either variable is ever set in this workflow.
  # ---------------------------------------------------------------------------
  e2e-windows-encoding:
    name: Installed console encoding (Windows, py${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    env:
      CREATE_FORGE_E2E_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Installed console encoding tests
        run: uv run pytest -m e2e tests/test_e2e_installed_encoding.py

  # ---------------------------------------------------------------------------
  # Single required status check for branch protection. Gates on the *pinned*
  # Linux call and the Windows jobs only -- never on the runner canary, which
  # lives in its own workflow (runner-canary.yml) and cannot produce this
  # check's name.
  # ---------------------------------------------------------------------------
  all-green:
    name: All checks passed
    runs-on: ubuntu-24.04
    needs: [linux, windows, e2e-windows, e2e-windows-encoding]
    if: always()
    steps:
      - name: Verify
        run: |
          if [ "${{ needs.linux.result }}" != "success" ]; then
            echo "::error::The Linux checks did not pass"; exit 1
          fi
          if echo "${{ join(needs.*.result, ',') }}" | grep -qE 'failure|cancelled'; then
            echo "::error::One or more jobs failed"; exit 1
          fi
          echo "All jobs passed."
