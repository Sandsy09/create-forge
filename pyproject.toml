[build-system]
# Hatchling rather than uv_build: templates.toml is package data, and
# Hatchling's inclusion rules for non-Python files are explicit and well
# documented. Getting this wrong passes locally and breaks under uvx.
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "create-forge"
version = "0.1.0"
description = "Scaffold modern Python projects from maintained templates."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex" }]
keywords = ["scaffold", "template", "copier", "project", "cookiecutter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]

dependencies = [
    # Pinned to a major: the Python API is public but evolves faster than the
    # CLI. runner.py is the only module that touches it.
    "copier>=9.4,<10",
    "typer>=0.15",
    "questionary>=2.0",
    "pydantic>=2.10",
    "rich>=13.9",
]

[project.scripts]
create-forge = "create_forge.cli:app"

[project.urls]
Homepage = "https://github.com/Sandsy09/create-forge"
Repository = "https://github.com/Sandsy09/create-forge"
Issues = "https://github.com/Sandsy09/create-forge/issues"
Changelog = "https://github.com/Sandsy09/create-forge/blob/main/CHANGELOG.md"

[dependency-groups]
lint = ["ruff>=0.14", "pre-commit>=4.0"]
test = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # Drives questionary without a TTY.
    "prompt-toolkit>=3.0",
    # Parses forge-template's copier.yml in tests/test_drift.py.
    "pyyaml>=6.0",
]
typecheck = ["mypy>=1.14", "types-PyYAML>=6.0"]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
    "poethepoet>=0.31",
    "git-cliff>=2.7",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/create_forge"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "CHANGELOG.md"]

# -----------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH",
    "RUF", "ANN", "D", "S", "PL",
]
ignore = ["D107", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "S101", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["create_forge"]

[tool.ruff.format]
docstring-code-format = true

# -----------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# questionary ships no stubs.
module = ["questionary.*"]
ignore_missing_imports = true

# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov",
    "--cov-report=term-missing",
]
markers = [
    "network: hits GitHub; deselect with -m 'not network'",
]

[tool.coverage.run]
source = ["src/create_forge"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

# -----------------------------------------------------------------------------

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
"lint:fix" = "ruff check --fix ."
"format:check" = "ruff format --check ."
typecheck = "mypy"
test = "pytest -m 'not network'"
"test:all" = "pytest"
check = ["format:check", "lint", "typecheck", "test"]
changelog = "git-cliff --output CHANGELOG.md"

# Verifies templates.toml actually ships in the wheel. This is the failure
# that passes every local test and breaks on first uvx run.
"check:wheel" = { shell = "uv build && python -m zipfile -l dist/*.whl | grep templates.toml" }

[tool.git-cliff.changelog]
header = "# Changelog\n\nGenerated by git-cliff from Conventional Commits.\n"
trim = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^(chore|build|ci)", skip = true },
]