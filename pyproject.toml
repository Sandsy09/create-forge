[build-system]
# Hatchling rather than uv_build: templates.toml is package data, and
# Hatchling's inclusion rules for non-Python files are explicit and well
# documented. Getting this wrong passes locally and breaks under uvx.
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "create-forge"
version = "0.3.2"
description = "Scaffold modern Python projects from maintained templates."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex" }]
keywords = ["scaffold", "template", "copier", "project", "cookiecutter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]

dependencies = [
    # Pinned to a major: the Python API is public but evolves faster than the
    # CLI. runner.py is the only module that touches it. The lower bound was
    # raised past the destination-escape advisories to 9.15.2 (ADR 0038), then
    # to 9.16 (ADR 0039): 9.16 is the first release with the git-mirror cache
    # and COPIER_CACHE_DIR that runner.py models and `doctor` reports -- a
    # required-behaviour move, not an advisory one. The whole >=9.16 range is
    # advisory-free. See docs/engine-updates.md.
    "copier>=9.16,<10",
    # >=0.16: typer 0.15.0-0.15.3 declare an uncapped click and break against
    # click >=8.2 (TyperArgument.make_metavar), and 0.15.4 pins click <8.2.
    # 0.16.0 is the first release that works with current click. The CI
    # `floor` job (ADR 0038) is what caught the stale >=0.15 bound.
    "typer>=0.16",
    "questionary>=2.0",
    "pydantic>=2.10",
    "rich>=13.9",
    "pyyaml>=6.0",
    # runner.py resolves Copier's cache directory by Copier's own documented
    # rule (COPIER_CACHE_DIR, else the platformdirs user cache). Pinned to the
    # bound Copier itself declares so it adds no resolution pressure and the
    # CI `floor` job sees the version Copier's own floor would (ADR 0039).
    "platformdirs>=4.3.6",
]

[project.optional-dependencies]
# ADR 0018 assigned the first released engine range; ADR 0026 moved it to the
# `forge-template` 0.4 compatibility line (the first to ship the Data Science
# archetype and reusable capabilities), and ADR 0031 adopts the reviewed 0.4.1
# release as the lower bound. Still an optional extra rather than a hard
# dependency, so ADR 0014's guarded `try/except ImportError` in cli.py stays
# meaningful and the default Copier path never downloads an engine it doesn't
# call. src/create_forge/engine.py is the only module that imports it;
# src/create_forge/compat.py holds the range itself so cli.py's `doctor` can
# report it without importing the engine. ADR 0021 adds bounded uv to finalise
# the engine render's dynamic lockfile; ADR 0038 reviewed that `uv` floor
# against the advisory record and held it -- the whole `>=0.12,<0.13` range is
# already advisory-free.
engine = ["forge-template>=0.4.1,<0.5", "uv>=0.12,<0.13"]

[project.scripts]
create-forge = "create_forge.cli:app"

[project.urls]
Homepage = "https://github.com/Sandsy09/create-forge"
Repository = "https://github.com/Sandsy09/create-forge"
Issues = "https://github.com/Sandsy09/create-forge/issues"
Changelog = "https://github.com/Sandsy09/create-forge/blob/main/CHANGELOG.md"

[dependency-groups]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]
lint = ["ruff>=0.14", "pre-commit>=4.0"]
test = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # Drives questionary without a TTY.
    "prompt-toolkit>=3.0",
    # Parses forge-template's copier.yml in tests/test_drift.py.
    "pyyaml>=6.0",
]
typecheck = ["mypy>=1.14", "types-PyYAML>=6.0"]
dev = [
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
    "poethepoet>=0.31",
    "git-cliff>=2.7",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/create_forge"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "CHANGELOG.md"]

# -----------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH",
    "RUF", "ANN", "D", "S", "PL",
]
ignore = ["D107", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "S101", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["create_forge", "adr"]

[tool.ruff.format]
docstring-code-format = true

# -----------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts", "examples"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# questionary ships no stubs.
module = ["questionary.*"]
ignore_missing_imports = true

# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Lets tests/test_adr.py `import adr` -- scripts/ is dev-only tooling, never
# shipped in the wheel, so it isn't a package under src/create_forge.
# examples/ is the CF-09.02 downstream-client reference (ADR 0023),
# similarly repo-only -- tests/test_downstream_reference.py imports it as
# `downstream_cli`.
pythonpath = ["scripts", "examples"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov",
    "--cov-report=term-missing",
]
markers = [
    "network: hits GitHub; deselect with -m 'not network'",
    "e2e: scaffolds a real project and runs its checks; deselect with -m 'not e2e'",
]

[tool.coverage.run]
source = ["src/create_forge"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

# -----------------------------------------------------------------------------

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
"lint:fix" = "ruff check --fix ."
"format:check" = "ruff format --check ."
typecheck = "mypy"
test = "pytest -m 'not network and not e2e'"
"test:all" = "pytest"
"test:e2e" = "pytest -m e2e"
check = ["format:check", "lint", "typecheck", "test"]
changelog = "git-cliff --output CHANGELOG.md"
docs = "mkdocs serve"
"docs:build" = "mkdocs build --strict"

# Verifies templates.toml actually ships in the wheel. This is the failure
# that passes every local test and breaks on first uvx run. Builds into a
# fresh tempdir each run so a stale dist/*.whl can never satisfy the check --
# see scripts/check_wheel.py.
"check:wheel" = "python scripts/check_wheel.py"

# Verifies docs/adr/ stays internally consistent -- filenames, numbering, the
# index, and the four Nygard headings. Also runs inside the fast test suite
# via tests/test_adr.py; this is the standalone entry point.
"check:adr" = "python scripts/adr.py"

# Verifies every workflow pins its external actions to a full commit SHA and
# keeps write permissions off the workflow level (ADR 0037). Also runs inside
# the fast test suite via tests/test_workflows.py; this is the standalone
# entry point -- see scripts/check_workflows.py.
"check:workflows" = "python scripts/check_workflows.py"

# Reconciles a repo's GitHub labels against .github/labels.toml. Idempotent:
# `gh label create --force` creates or updates. Pass extra args after `--`,
# e.g. `uv run poe labels:sync --dry-run` or `--repo OWNER/NAME --prune`
# -- see scripts/labels.py.
"labels:sync" = "python scripts/labels.py"

[tool.git-cliff.changelog]
header = "# Changelog\n\nGenerated by git-cliff from Conventional Commits.\n"
trim = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^(chore|build|ci)", skip = true },
]
